
services:
  backend:
    platform: linux/amd64
    build:
      context: ./backend
    container_name: parkease-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
    restart: unless-stopped

  frontend:
    platform: linux/amd64
    build:
      context: ./frontend
    container_name: parkease-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
    depends_on:
      - backend
    restart: unless-stopped
